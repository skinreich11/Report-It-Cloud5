[project]
name = "report-it"
version = "0.1.0"
description = "Flask app for preparing Open311-style street issue reports."
requires-python = ">=3.12,<3.14"
dependencies = [
    "Flask>=3.0,<4.0",
    "openai>=3.0,<4.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.vercel]
entrypoint = "main:app"
